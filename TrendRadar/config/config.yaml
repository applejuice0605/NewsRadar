# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
#                      Version: 2.4.0
#
# 由升级迁移生成：以官方 6.10 配置为底，保留本地调度、RSS、通知、AI、存储设置。
# ═══════════════════════════════════════════════════════════════

app:
  timezone: Asia/Shanghai
  show_version_update: true
schedule:
  enabled: true
  preset: morning_evening
platforms:
  enabled: true
  api_url: ''
  sources:
  - id: toutiao
    name: 今日头条
    expected_domain: toutiao.com
  - id: baidu
    name: 百度热搜
    expected_domain: baidu.com
  - id: wallstreetcn-hot
    name: 华尔街见闻
    expected_domain: wallstreetcn.com
  - id: thepaper
    name: 澎湃新闻
    expected_domain: thepaper.cn
  - id: bilibili-hot-search
    name: bilibili 热搜
    expected_domain: bilibili.com
  - id: ifeng
    name: 凤凰网
    expected_domain: ifeng.com
  - id: zhihu
    name: 知乎
    expected_domain: zhihu.com
  - id: tencent-hot
    name: 腾讯新闻 综合早报
    expected_domain: qq.com
  - id: v2ex
    name: V2EX
    expected_domain: v2ex.com
  - id: juejin
    name: 掘金
    expected_domain: juejin.cn
  - id: ithome
    name: IT之家
    expected_domain: ithome.com
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1
  feeds:
  - id: hacker-news
    name: Hacker News
    url: https://hnrss.org/frontpage
    enabled: false
  - id: ruanyifeng
    name: 阮一峰的网络日志
    url: http://www.ruanyifeng.com/blog/atom.xml
    enabled: false
  - id: yahoo-finance
    name: 雅虎财经
    url: https://finance.yahoo.com/news/rssindex
    enabled: false
  - id: wechat-rss
    name: WeChat RSS
    url: "${WECHAT_RSS_URL}"
    enabled: true
report:
  mode: current
  display_mode: keyword
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 0
filter:
  method: ai
  priority_sort_enabled: true
ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.7
  reclassify_threshold: 0.6
  prompt_file: prompt.txt
  extract_prompt_file: extract_prompt.txt
  update_tags_prompt_file: update_tags_prompt.txt
display:
  region_order:
  - new_items
  - hotlist
  - rss
  - ai_analysis
  - standalone
  regions:
    hotlist: true
    new_items: true
    rss: true
    standalone: false
    ai_analysis: true
  standalone:
    platforms:
    - zhihu
    - wallstreetcn-hot
    - toutiao
    - baidu
    - thepaper
    - cls-hot
    - tencent-hot
    - ifeng
    - cls-depth
    - juejin
    - v2ex
    - ithome
    - douyin
    - bilibili-hot-search
    rss_feeds:
    - ruanyifeng
    - AIGC
    - tech
    max_items: 5
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ''
    dingtalk:
      webhook_url: ''
    wework:
      webhook_url: ''
      msg_type: markdown
    telegram:
      bot_token: ''
      chat_id: ''
    email:
      from: ''
      password: ''
      to: ''
      smtp_server: ''
      smtp_port: ''
    ntfy:
      server_url: https://ntfy.sh
      topic: ''
      token: ''
    bark:
      url: ''
    slack:
      webhook_url: ''
    generic_webhook:
      webhook_url: ''
      payload_template: ''
      structured: false
storage:
  backend: auto
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: output
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ''
    bucket_name: ''
    access_key_id: ''
    secret_access_key: ''
    region: ''
  pull:
    enabled: false
    days: 7
ai:
  model: anthropic/MiniMax-M2.5
  api_key: ''
  api_base: ''
  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1
  fallback_models: []
ai_analysis:
  enabled: true
  language: Chinese
  prompt_file: ai_analysis_prompt.txt
  mode: daily
  max_news_for_analysis: 150
  include_rss: true
  include_standalone: false
  include_rank_timeline: true
podcast:
  enabled: true
  voice: zh-CN-XiaoxiaoNeural
  rate: +0%
  volume: +0%
  max_source_chars: 12000
  max_script_chars: 4500
  prompt_file: podcast_prompt.txt
ai_translation:
  enabled: true
  language: 中文
  prompt_file: ai_translation_prompt.txt
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: false
    rss: true
    standalone: true
advanced:
  debug: false
  version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version
  mcp_version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp
  configs_version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: http://127.0.0.1:10801
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ''
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: ━━━━━━━━━━━━━━━━
